specs:
  fitness:
    description: Mean classification accuracy on the fixed PneumoniaMNIST training subset
    decimals: 4
    is_primary: true
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.02
    sentinel_value: -1
  is_valid:
    description: Whether the candidate conforms to the prompt and sampling contract
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 1.0
    sentinel_value: 0
  parse_success_rate:
    description: Fraction of images producing a valid binary class and matching name
    decimals: 3
    is_primary: false
    higher_is_better: true
    lower_bound: 0.0
    upper_bound: 1.0
    include_in_prompts: true
    significant_change: 0.05
    sentinel_value: 0
